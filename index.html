<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：优化手机端视口缩放与触控延迟 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>佬王安全实验室 - 移动控制端</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-blue: #00f0ff;
            --dark-bg: #090a0f;
            --terminal-bg: #11131e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', 'Microsoft YaHei', monospace;
            -webkit-tap-highlight-color: transparent; /* 消除手机端点击高亮蓝框 */
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* 电子扫描线滤镜 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            z-index: 10;
            background-size: 100% 3px;
            pointer-events: none;
        }

        /* 主控制台：手机默认一列竖排，大屏自动转两列 */
        .container {
            width: 100%;
            max-width: 440px; /* 适合主流手机宽度 */
            background-color: var(--terminal-bg);
            border: 2px solid #1f2335;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        /* 大屏幕平板或电脑端自动切换为双栏并排 */
        @media (min-width: 768px) {
            .container {
                max-width: 850px;
                display: grid;
                grid-template-columns: 1.1fr 1fr;
            }
        }

        /* 牢笼收容区 */
        .containment-zone {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, #171b2d 0%, #0d0f17 100%);
            border-bottom: 2px solid #1f2335;
        }
        @media (min-width: 768px) {
            .containment-zone {
                border-bottom: none;
                border-right: 2px solid #1f2335;
                padding: 24px;
                justify-content: center;
            }
        }

        /* 顶部红色警报栏 */
        .status-header {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 49, 49, 0.08);
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            text-align: center;
            color: var(--neon-red);
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
            animation: blink 2s infinite;
        }

        /* 手机端自适应大小的电子牢笼 */
        .prison-chamber {
            width: 100%;
            max-width: 200px; /* 手机端适度缩小，留出操作空间 */
            aspect-ratio: 1;
            position: relative;
        }
        @media (min-width: 768px) {
            .prison-chamber {
                max-width: 260px;
            }
        }

        /* 控制面板区 */
        .control-panel {
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }
        @media (min-width: 768px) {
            .control-panel {
                padding: 24px;
                gap: 16px;
            }
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--neon-blue);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-desc {
            font-size: 0.75rem;
            color: #70758c;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        /* 2x2 状态网格 */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-card {
            background-color: #161824;
            border: 1px solid #24293f;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #555b73;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--neon-green);
        }

        /* 终端实时日志 */
        .terminal-log {
            background-color: #07080c;
            border: 1px solid #1b1d2a;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.7rem;
            color: #4af626;
            height: 85px; /* 手机端更紧凑 */
            overflow-y: auto;
            line-height: 1.4;
        }

        /* 专为手机优化的大点击区按钮 */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            background: transparent;
            border: 1.5px solid #333854;
            color: #fff;
            padding: 12px 10px; /* 完美符合移动端触控高度限制 */
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-primary {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        /* 手机触按反馈效果 */
        .btn-primary:active {
            background: var(--neon-green);
            color: #000;
            transform: scale(0.96);
        }

        .btn-danger {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }

        .btn-danger:active {
            background: var(--neon-red);
            color: #fff;
            transform: scale(0.96);
        }

        /* 响应式背景大水印 */
        .captured-watermark {
            position: absolute;
            font-size: 10vw; /* 随屏幕大小智能缩放 */
            font-weight: 900;
            color: rgba(255, 255, 255, 0.012);
            pointer-events: none;
            user-select: none;
            z-index: 1;
            white-space: nowrap;
            transform: rotate(-15deg);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- 响应式巨幅背景水印 -->
    <div class="captured-watermark">LAOWANG CONTROL</div>

    <!-- 移动端主界面 -->
    <div class="container">
        
        <!-- 上：电子牢笼区 -->
        <div class="containment-zone">
            <div class="status-header" id="mainStatus">
                ⚠️ 小鸡已被佬王脚本捕获 ⚠️
            </div>

            <!-- SVG 矢量高保真力场牢笼 -->
            <div class="prison-chamber">
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <defs>
                        <!-- 霓虹力场发光 -->
                        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" />
                            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.4" />
                        </filter>
                        <!-- 警报发红 -->
                        <filter id="alarmGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff3131" />
                        </filter>
                    </defs>

                    <!-- 牢笼背景底座 -->
                    <ellipse cx="100" cy="165" rx="75" ry="20" fill="#151728" stroke="#333854" stroke-width="2"/>
                    <ellipse cx="100" cy="165" rx="60" ry="15" fill="#0d0e15"/>

                    <!-- 【可爱小鸡】 🐥 -->
                    <g id="chick" transform="translate(0, 0)" style="transition: transform 0.1s ease;">
                        <ellipse cx="100" cy="155" rx="25" ry="8" fill="#000" opacity="0.4" />
                        <!-- 身体 -->
                        <circle cx="100" cy="120" r="24" fill="#ffd54f" />
                        <!-- 头顶呆毛 -->
                        <path d="M 100 96 Q 95 86 102 82 Q 102 91 100 96 Z" fill="#ffd54f" />
                        <path d="M 103 96 Q 108 88 111 86 Q 107 92 103 96 Z" fill="#ffd54f" />
                        <!-- 眼睛 -->
                        <circle cx="91" cy="115" r="3.5" fill="#2d1f12" />
                        <circle cx="90" cy="113.5" r="1" fill="#ffffff" />
                        <circle cx="109" cy="115" r="3.5" fill="#2d1f12" />
                        <circle cx="108" cy="113.5" r="1" fill="#ffffff" />
                        <!-- 腮红 -->
                        <circle cx="86" cy="122" r="2.5" fill="#ff8a80" opacity="0.8" />
                        <circle cx="114" cy="122" r="2.5" fill="#ff8a80" opacity="0.8" />
                        <!-- 委屈的扁嘴 -->
                        <path d="M 97 121 Q 100 126 103 121 Q 100 123 97 121 Z" fill="#ff9100" stroke="#ff6d00" stroke-width="1" />
                        <!-- 翅膀 -->
                        <path d="M 76 122 Q 72 112 78 128 Z" fill="#ffca28" />
                        <path d="M 124 122 Q 128 112 122 128 Z" fill="#ffca28" />
                        <!-- 鸡爪 -->
                        <path d="M 92 144 L 88 152 M 92 144 L 92 153 M 92 144 L 96 151" stroke="#ff9100" stroke-width="2.5" stroke-linecap="round" />
                        <path d="M 108 144 L 104 151 M 108 144 L 108 153 M 108 144 L 112 151" stroke="#ff9100" stroke-width="2.5" stroke-linecap="round" />
                        <!-- 受惊流汗 💧 -->
                        <path d="M 116 104 Q 120 100 120 108 Q 116 108 116 104" fill="#00f0ff" />
                    </g>

                    <!-- 【霓虹高压电网围栏】 -->
                    <g id="electricFence" filter="url(#neonGlow)">
                        <line x1="45" y1="70" x2="45" y2="165" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
                        <line x1="155" y1="70" x2="155" y2="165" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
                        <line x1="100" y1="50" x2="100" y2="70" stroke="#00f0ff" stroke-width="3" />
                        <path d="M 45 90 Q 100 105 155 90" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2" />
                        <path d="M 45 115 Q 100 130 155 115" fill="none" stroke="#00f0ff" stroke-width="2.5" />
                        <path d="M 45 140 Q 100 155 155 140" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 4" />
                        <!-- 锁头 -->
                        <rect x="88" y="65" width="24" height="20" rx="3" fill="#0d0e15" stroke="#00f0ff" stroke-width="2" />
                        <path d="M 93 65 L 93 58 Q 100 50 107 58 L 107 65" fill="none" stroke="#00f0ff" stroke-width="2" />
                        <circle cx="100" cy="75" r="2" fill="#ff3131" />
                    </g>

                    <!-- 高压电火花 -->
                    <g id="spark" stroke="#ffffff" stroke-width="1.5" opacity="0">
                        <path d="M 80 110 L 85 105 L 82 118 L 88 112" />
                        <path d="M 120 125 L 125 120 L 122 133 L 128 127" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- 下：控制面板区 -->
        <div class="control-panel">
            <div>
                <h2 class="panel-title">
                    <span>LAOWANG_MOBILE_OS</span>
                    <span style="color: var(--neon-green); font-size: 0.7rem; border: 1.5px solid var(--neon-green); padding: 1px 4px; border-radius: 4px; font-weight: bold;">CONNECTED</span>
                </h2>
                <p class="panel-desc">高阶自动诱捕协议激活中</p>

                <!-- 监控状态面板 -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">电网电压</div>
                        <div class="stat-value" id="valVoltage">800 V</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">逃逸概率</div>
                        <div class="stat-value" id="valEscape">0.00%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">生命特征</div>
                        <div class="stat-value" style="color: #ffb300;" id="valVitals">🐥 绝望发抖</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">底层加密</div>
                        <div class="stat-value" style="color: var(--neon-blue);">AES_256</div>
                    </div>
                </div>

                <!-- 紧凑命令行日志 -->
                <div class="terminal-log" id="logBox">
                    <div>[OS] 手机控制节点初始化完毕...</div>
                    <div>[EXPLOIT] 注入小鸡底层接口...成功。</div>
                    <div>[STATUS] 捕获器正常运作，脚本强力压制中。</div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="btn-group">
                <button class="btn btn-primary" onclick="shockChamber()">⚡ 加大电压</button>
                <button class="btn btn-danger" onclick="attemptEscape()">🔓 尝试越狱</button>
            </div>
        </div>

    </div>

    <!-- 核心逻辑与触摸事件 -->
    <script>
        const logBox = document.getElementById('logBox');
        const electricFence = document.getElementById('electricFence');
        const mainStatus = document.getElementById('mainStatus');
        const spark = document.getElementById('spark');
        const valVoltage = document.getElementById('valVoltage');
        const valEscape = document.getElementById('valEscape');
        const valVitals = document.getElementById('valVitals');
        const chick = document.getElementById('chick');

        function addLog(text, type = 'info') {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            if (type === 'warn') div.style.color = 'var(--neon-red)';
            else if (type === 'success') div.style.color = 'var(--neon-green)';
            else if (type === 'blue') div.style.color = 'var(--neon-blue)';
            div.innerHTML = `[${time}] ${text}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 按钮 1：加大电压
        function shockChamber() {
            electricFence.setAttribute('filter', 'url(#alarmGlow)');
            spark.style.opacity = '1';
            valVoltage.innerText = '9999 V';
            valVitals.innerText = '🐥 惊恐超载';
            
            // 小鸡高频颤抖
            chick.setAttribute('transform', 'translate(1.5, -1.5)');
            setTimeout(() => chick.setAttribute('transform', 'translate(-1.5, 1.5)'), 40);
            setTimeout(() => chick.setAttribute('transform', 'translate(1.5, 1.5)'), 80);
            setTimeout(() => chick.setAttribute('transform', 'translate(-1.5, -1.5)'), 120);
            setTimeout(() => chick.setAttribute('transform', 'translate(0, 0)'), 160);

            addLog('上调电网功率至极致：9999V！', 'warn');

            setTimeout(() => {
                electricFence.setAttribute('filter', 'url(#neonGlow)');
                spark.style.opacity = '0';
                valVoltage.innerText = '800 V';
            }, 800);
        }

        // 按钮 2：尝试越狱
        function attemptEscape() {
            addLog('侦测到终端触屏强制越狱请求...', 'blue');
            valEscape.innerText = '25.6%';
            mainStatus.innerText = '🚨 WARNING: 拦截非法解密行为 🚨';
            mainStatus.style.background = 'rgba(255, 49, 49, 0.25)';
            
            setTimeout(() => {
                addLog('佬王防御脚本部署动态沙箱，开始二次核验...', 'warn');
                setTimeout(() => {
                    addLog('核验通过。越狱进程已被抹除！', 'success');
                    valEscape.innerText = '0.00%';
                    valVitals.innerText = '🐥 眼神空洞';
                    mainStatus.innerText = '⚠️ 小鸡已被佬王脚本捕获 ⚠️';
                    mainStatus.style.background = 'rgba(255, 49, 49, 0.08)';
                }, 800);
            }, 800);
        }
    </script>
</body>
</html>
